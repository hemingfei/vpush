services:
  vpush:
    build: .
    container_name: vpush
    restart: unless-stopped
    user: "99:100"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config.yaml
      - DB_PATH=/data/dav.db
      - IMA_ARCHIVE_ROOT=${IMA_ARCHIVE_ROOT:-}
      - IMA_PULL_URL=${IMA_PULL_URL:-}
      - IMA_PULL_TOKEN=${IMA_PULL_TOKEN:-}
      - IMA_STORAGE_STATUS_PATH=${IMA_STORAGE_STATUS_PATH:-}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/data
      - ${IMA_ARCHIVE_HOST_PATH:-./data/ima}:/data/ima-archive
