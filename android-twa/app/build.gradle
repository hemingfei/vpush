plugins {
    id 'com.android.application'
}

def signingPasswordFile = rootProject.file('keystore-password.txt')
def signingPassword = System.getenv('VPUSH_TWA_KEYSTORE_PASSWORD')
if (!signingPassword && signingPasswordFile.isFile()) {
    signingPassword = signingPasswordFile.getText('UTF-8').trim()
}

android {
    namespace 'net.vpush.twa'
    compileSdk 36

    defaultConfig {
        applicationId 'net.vpush.twa'
        minSdk 26
        targetSdk 35
        versionCode 112163
        versionName "1.12.163"
    }

    signingConfigs {
        release {
            storeFile file('../vpush-twa.keystore')
            storePassword signingPassword ?: ''
            keyAlias 'vpush'
            keyPassword signingPassword ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
