# Add this service to /opt/vpush-ima-lab compose (lab only).
# Not production vpush. Not a reading desk.
#
# Access (password still required):
#   1. Preferred — Tailscale. Host network + ARM_OPS_BIND=tailscale
#      (resolved at start via `tailscale ip -4` or iface tailscale0).
#      From a tailnet node: http://$(tailscale ip -4):8055
#   2. Fallback — loopback + tunnel:
#      ssh -L 8055:127.0.0.1:8055 oracle-sj-arm
#   3. Do not publish 0.0.0.0:8055 on the public NIC.
#
# uvicorn binds an IP, not an interface name. Pin the address if lookup
# fails inside the image:
#   ARM_OPS_BIND=$(tailscale ip -4) docker compose up -d arm-lab-ops
# Or put that IPv4 in the lab .env. Alternative on the host:
#   ARM_OPS_BIND=127.0.0.1 python ops_app.py
#   tailscale serve --bg 8055

services:
  arm-lab-ops:
    build: ./arm-lab-ops
    container_name: arm-lab-ops
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      ARM_OPS_BIND: ${ARM_OPS_BIND:-tailscale}
      ARM_OPS_PORT: "8055"
      CACHE_ROOT: /data/vpush-ima-cache
      P115_COOKIES_FILE: /secrets/115-cookies.txt
      IMA_PURE_SECRETS_FILE: /secrets/ima-pure.json
      ARM_OPS_PASSWORD_FILE: /secrets/arm-ops-password.txt
      # Prefer the file above. If you inject env instead, do it from a
      # host env file that is never committed.
      # ARM_OPS_PASSWORD: ""
      P115_DEVICE_TYPE: harmony
      OPENLIST_PUBLIC_URL: http://127.0.0.1:5244/lab-hot
      # Optional: HTTP or file JSON from healthcheck.py
      # PULLER_HEALTH_URL: http://127.0.0.1:8099/health
      # PULLER_HEALTH_FILE: /data/vpush-ima-cache/logs/health.json
      # PULLER_CONTAINER_NAME: vpush-ima-lab-puller
    volumes:
      - /data/vpush-ima-cache:/data/vpush-ima-cache:ro
      # rw only so QR login can replace 115-cookies.txt (0600). Do not
      # mount this into any public service.
      - /secrets:/secrets
      # Optional: puller container status when docker.sock is present.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # Fallback if Tailscale is down: ARM_OPS_BIND=127.0.0.1 and SSH tunnel.
    # Do not use ports: ["0.0.0.0:8055:8055"] — that is the public NIC.
    # Loopback-only publish (no tailnet) if you must map ports instead of host net:
    # ports:
    #   - "127.0.0.1:8055:8055"
    # environment:
    #   ARM_OPS_BIND: "0.0.0.0"   # WARNING: container-internal only; host publish must stay 127.0.0.1
