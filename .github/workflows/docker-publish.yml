name: Publish Docker image

on:
  push:
    branches: ["main", "hmf"]
    tags: ["v*"]

env:
  IMAGE_NAME: vpush
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/vpush

# 供应链加固：CI 无写仓库权限；发布作业单独放开 packages:write / actions:write
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 串行全量 CI 实测 8-14 分钟，xdist 并行（loadscope 按文件分发）本地 32 核 60→11 分钟，
    # CI 4 核预计 4-7 分钟。步骤 30 / job 35 分钟红线：覆盖 runner 偶发 2-4 倍变慢
    # （曾发生：23f3522 串行跑到 74% 撞 20 分钟线被砍、发布全部 skipped）。
    timeout-minutes: 35
    steps:
      # actions 均按 commit SHA 固定，防止上游 tag 被替换；审阅通过后逐项验证再升级
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: waf-bot/package-lock.json
      - name: 安装依赖并跑测试
        timeout-minutes: 30
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          python -m pytest -q --maxfail=1 -n auto --dist loadscope
      - name: 前端静态检查
        timeout-minutes: 3
        run: |
          find app/static -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
          python scripts/bump_assets.py --check
          python scripts/check_inline_handlers.py
          python scripts/check_platform_badges.py
          node --check miniprogram/utils/api.js
          node --check miniprogram/pages/*/*.js
      - name: sidecar 测试
        timeout-minutes: 3
        working-directory: waf-bot
        run: |
          npm ci --ignore-scripts
          npm test

  # VPS 只拉 amd64。tag 先推单架构版本 tag / latest，不必等 arm64。
  publish-amd64:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 镜像 tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:${GITHUB_REF_NAME}"
            echo "${GHCR_IMAGE}:latest"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
              echo "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 构建并推送 amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # arm64 后台交叉编译，合并进同一 version / latest 清单。失败不影响已上线的 amd64。
  publish-arm64:
    needs: publish-amd64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 设置 QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 镜像 tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:${GITHUB_REF_NAME}-arm64"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_REF_NAME}-arm64"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 构建并推送 arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: 合并多架构清单
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${GITHUB_REF_NAME}" \
            -t "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${GITHUB_REF_NAME}" \
            "${GHCR_IMAGE}:${GITHUB_REF_NAME}-arm64"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            docker buildx imagetools create \
              -t "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
              -t "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest" \
              "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
              "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_REF_NAME}-arm64"
          fi

  # hmf 开发分支：每次 push 复用 test 作业做门禁后，构建 amd64 单架构开发镜像，
  # 固定推 :hmf tag（Docker Hub 用仓库级 DOCKERHUB_USERNAME/TOKEN，即本人账号），
  # 不动版本 tag / latest，arm64 与多架构清单仍只保留给 v* tag 正式发布；
  # 推送成功后触发 Jenkins 把 VPS 上的 :hmf 容器滚动到新镜像。
  # 依赖 secrets：JENKINS_URL（基地址，支持 https——强烈建议套 TLS，Basic Auth 不过明文）、
  # JENKINS_TOKEN（openclaw 账号 API Token）、VPUSH_WEBHOOK_URL/SECRET（系统通知预告）。
  publish-hmf:
    needs: test
    if: github.ref == 'refs/heads/hmf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 镜像 tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:hmf"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:hmf"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 构建并推送 hmf 开发镜像（amd64）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      # 镜像推完后先经V平台「系统通知」KOL 预告即将重启（webhook 飞书同款签名），
      # 再触发 VPS 上的 Jenkins 拉新镜像重启容器（compose pull && up -d）。
      # 预告是礼节性通知：webhook 抖动不阻断部署（continue-on-error 红标留痕）。
      # 部署触发后全程盯完：/build 排队 → 拿 build 号 → consoleText 增量回显 Jenkins
      # 四阶段日志（snapshot/pull/recreate/health check），结束校验 result=SUCCESS；
      # 超时（约 10min）、部署失败、健康检查不过都让本步骤红叉，Actions 发失败通知。
      # 轮询期单次网络抖动只当本轮无新输出，不杀 watch；触发失败则立刻报错退出。
      # Jenkins 任务已去参数化（原 IMAGE 参数删除，/build 即可，无需 buildWithParameters；
      # 若有人加回参数，/build 会 400，触发检查步会红并提示）。Jenkins 侧轮询触发已移除，
      # 本步骤是唯一自动部署入口；token 在 openclaw 账号 API Token（github-actions-vpush）。
      - name: 发布部署预告（系统通知）
        if: ${{ success() }}
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import base64, hashlib, hmac, json, os, time, urllib.request

          ts = int(time.time())
          secret = os.environ["VPUSH_WEBHOOK_SECRET"]
          sign = base64.b64encode(
              hmac.new(f"{ts}\n{secret}".encode(), digestmod=hashlib.sha256).digest()
          ).decode()
          payload = json.dumps({
              "title": "镜像更新预告",
              "text": f"docker 镜像已更新（commit {os.environ['GITHUB_SHA'][:7]}），"
                      "即将重启服务，请稍候。",
              "timestamp": ts,
              "sign": sign,
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              os.environ["VPUSH_WEBHOOK_URL"], data=payload, method="POST",
              headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=15) as r:
              print("webhook HTTP", r.status, r.read().decode("utf-8"))
          EOF
        env:
          VPUSH_WEBHOOK_URL: ${{ secrets.VPUSH_WEBHOOK_URL }}
          VPUSH_WEBHOOK_SECRET: ${{ secrets.VPUSH_WEBHOOK_SECRET }}
      # 预告先发、部署触发在后：触发失败时已发过「即将重启」，补发失败对冲，
      # 免得订阅者白等一次不会发生的重启（同 webhook、同样失败不阻断主流程）
      - name: 部署触发失败对冲通知
        if: ${{ failure() && steps.jenkins.outcome == 'failure' }}
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import base64, hashlib, hmac, json, os, time, urllib.request

          ts = int(time.time())
          secret = os.environ["VPUSH_WEBHOOK_SECRET"]
          sign = base64.b64encode(
              hmac.new(f"{ts}\n{secret}".encode(), digestmod=hashlib.sha256).digest()
          ).decode()
          payload = json.dumps({
              "title": "部署触发失败",
              "text": f"docker 镜像已推送（commit {os.environ['GITHUB_SHA'][:7]}），"
                      "但触发 Jenkins 部署失败，本次服务不会重启；"
                      "请检查 GitHub Actions 运行日志与 Jenkins 状态。",
              "timestamp": ts,
              "sign": sign,
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              os.environ["VPUSH_WEBHOOK_URL"], data=payload, method="POST",
              headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=15) as r:
              print("webhook HTTP", r.status)
          EOF
        env:
          VPUSH_WEBHOOK_URL: ${{ secrets.VPUSH_WEBHOOK_URL }}
          VPUSH_WEBHOOK_SECRET: ${{ secrets.VPUSH_WEBHOOK_SECRET }}
      - name: 触发 Jenkins 部署并跟踪全程
        id: jenkins
        if: ${{ success() }}
        timeout-minutes: 15
        env:
          # Jenkins 基地址走 secret（JENKINS_URL）：vpush 部署实例的地址与端口
          # 属基础设施信息，不进仓库；支持 https（推荐）与 http（内网/临时）。
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          set -euo pipefail
          J="${JENKINS_URL%/}"
          AUTH="openclaw:${{ secrets.JENKINS_TOKEN }}"
          JOB="vpush-deploy"

          echo "==> queueing deploy build..."
          # 不带 -f：4xx/网络错也要拿到响应头与状态码，否则 set -e 下报错提示走不到
          rm -f /tmp/jenkins_hdrs
          HTTP_CODE=$(curl -s -m 15 -X POST -D /tmp/jenkins_hdrs -o /dev/null \
            -w '%{http_code}' -u "$AUTH" "$J/job/$JOB/build?delay=0sec") || true
          LOC=$([ -f /tmp/jenkins_hdrs ] && tr -d '\r' < /tmp/jenkins_hdrs | awk 'tolower($1)=="location:"{print $2}' || true)
          if [ -z "$LOC" ]; then
            echo "ERROR: queue request rejected (HTTP status: '${HTTP_CODE:-network error}')"
            echo "       check JENKINS_URL/JENKINS_TOKEN secrets, job name '$JOB', and that the job has no parameters"
            exit 1
          fi

          echo "==> deploy queued, waiting to start..."
          # 排队等待与部署预算同量级（~10 分钟）：hmf 每 push 都部署，上一轮
          # 未结束时新 build 会排队；等不到就取消排队项再红叉，保证
          # 「Actions 报失败 = 真的没部署」，避免部署脱管照跑。
          BUILD_URL=""
          for i in $(seq 1 300); do
            BUILD_URL=$(curl -sf -u "$AUTH" "$LOC/api/json" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("executable",{}).get("url",""))' 2>/dev/null || true)
            [ -n "$BUILD_URL" ] && break
            sleep 2
          done
          if [ -z "$BUILD_URL" ]; then
            echo "ERROR: build did not start within ~10min (previous deploy still running? cancelling queued item)"
            curl -s -m 15 -X POST -u "$AUTH" "$LOC/cancelItem" >/dev/null 2>&1 || true
            exit 1
          fi
          N=$(basename "$BUILD_URL")
          echo "==> deploy build #${N} started: $J/job/$JOB/$N/"

          # consoleText 全量拉取 + 按字节增量打印（Jenkins 无增量端点）；
          # 命令替换会吞掉日志尾部换行，恰好保证跨轮次的行边界正确拼接；
          # 轮询间隙单次 curl 失败按「本轮无输出」处理，避免抖动杀掉 watch
          OFF=0
          RESULT=""
          for i in $(seq 1 200); do
            if LOG=$(curl -sf -m 15 -u "$AUTH" "$J/job/$JOB/$N/consoleText"); then
              SIZE=$(printf '%s' "$LOG" | wc -c)
              if [ "$SIZE" -gt "$OFF" ]; then
                printf '%s' "$LOG" | tail -c +"$((OFF+1))"
                OFF=$SIZE
              fi
            fi
            if R=$(curl -sf -m 15 -u "$AUTH" "$J/job/$JOB/$N/api/json?tree=building,result"); then
              if printf '%s' "$R" | grep -q '"building"[ ]*:[ ]*false'; then
                RESULT=$(printf '%s' "$R" | grep -o '"result"[ ]*:[ ]*"[^"]*"' | cut -d'"' -f4 || true)
                break
              fi
            fi
            sleep 3
          done
          [ -n "$RESULT" ] || { echo "ERROR: deploy finished without result (aborted?) or still running after ~10min"; exit 1; }
          echo ""
          echo "===== deploy result: $RESULT ====="
          [ "$RESULT" = "SUCCESS" ] || exit 1
