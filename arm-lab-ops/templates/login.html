<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARM 实验室运维 · 登录</title>
  <link rel="stylesheet" href="/static/ops.css">
</head>
<body class="paper">
  <main class="login-board">
    <p class="eyebrow">Oracle-SJ-ARM</p>
    <h1>实验室运维</h1>
    <p class="lede">中间层状态与 115 扫码。不是阅读台，也不是生产 vpush 后台。</p>
    {% if error %}
    <p class="banner banner-warn" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="stack">
      <label class="field">
        <span>口令</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary">进入面板</button>
    </form>
    <p class="hint">优先 Tailscale 本机 IPv4:8055（仍须口令）。备选 <code>ssh -L 8055:127.0.0.1:8055</code>。不要在公网 NIC 上挂 <code>0.0.0.0:8055</code>。</p>
  </main>
</body>
</html>
