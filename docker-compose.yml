services:
  vpush:
    build: .
    container_name: vpush
    restart: unless-stopped
    user: "99:100"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - VPUSH_INSTANCE=${VPUSH_INSTANCE:-}
      - CONFIG_PATH=/app/config.yaml
      - DB_PATH=/data/dav.db
      - IMA_ARCHIVE_ROOT=${IMA_ARCHIVE_ROOT:-}
      - IMA_PULL_URL=${IMA_PULL_URL:-}
      - IMA_PULL_TOKEN=${IMA_PULL_TOKEN:-}
      - IMA_STORAGE_STATUS_PATH=${IMA_STORAGE_STATUS_PATH:-}
      - FEISHU_CREDENTIAL_KEY=${FEISHU_CREDENTIAL_KEY:-}
      - FEISHU_DOCS_APP_ID=${FEISHU_DOCS_APP_ID:-}
      - FEISHU_DOCS_APP_SECRET=${FEISHU_DOCS_APP_SECRET:-}
      - FEISHU_DOCS_REDIRECT_URI=${FEISHU_DOCS_REDIRECT_URI:-}
      - FEISHU_DOCS_SCOPES=${FEISHU_DOCS_SCOPES:-wiki:node:read docx:document:readonly docs:document.media:download offline_access}
      - FEISHU_DOCS_INTERVAL_SECONDS=${FEISHU_DOCS_INTERVAL_SECONDS:-60}
      - IMGBED_BASE_URL=${IMGBED_BASE_URL:-}
      - IMGBED_TOKEN=${IMGBED_TOKEN:-}
      - IMGBED_CHANNEL=${IMGBED_CHANNEL:-telegram}
      - IMGBED_CHANNEL_NAME=${IMGBED_CHANNEL_NAME:-vpush-imgbed}
      - IMGBED_FOLDER=${IMGBED_FOLDER:-vpush}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/data
      - ${IMA_ARCHIVE_HOST_PATH:-./data/ima}:/data/ima-archive
