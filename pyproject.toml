[tool.ruff]
target-version = "py311"
# work/：未跟踪的本地草稿区，不参与检查
exclude = [
    "work/",
    # Oracle-SJ-ARM /opt/vpush-ima-lab/scripts/ 权威副本，保持与宿主机一致
    "scripts/lab_common.py",
    "scripts/manifest.py",
    "scripts/puller_loop.py",
]

[tool.ruff.lint]
# B008: FastAPI Depends() 作为默认值（框架惯用法）
# BLE001: 抓取/推送等边界处使用裸 except 兜底（均带注释说明）
# RUF100: 代码里保留的 noqa（与 BLE001 配套）
# DTZ005/006/007/011: 服务固定 TZ=Asia/Shanghai，本地时间即为业务时间
# TRY004: 配置解析统一捕获 ValueError 包装提示，语义更明确
# FLY002: 测试里 "\n".join 拼多行 payload 比 f-string 清晰
# RUF012: 测试 Fake 类的可变类属性无需 ClassVar 标注
ignore = ["B008", "BLE001", "RUF100", "DTZ005", "DTZ006", "DTZ007", "DTZ011", "TRY004", "FLY002", "RUF012"]
